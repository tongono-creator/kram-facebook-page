<!doctype html><html lang="th"><head><meta charset="utf-8"><style>
/*FONTS*/
*{box-sizing:border-box}html,body{margin:0;background:#101315}#canvas{position:relative;width:var(--w);height:var(--h);background:#111719;color:white;overflow:hidden;display:flex;flex-direction:column;font-family:Sarabun,sans-serif}
.photos{display:grid;flex:1;min-height:0;gap:6px;background:#111719;grid-template-columns:1fr}.photos figure{margin:0;overflow:hidden;position:relative;background:#ececea}.photos figure.safe-fit::before{content:'';position:absolute;inset:-35px;background-image:var(--photo);background-size:cover;background-position:center;filter:blur(26px);opacity:.5}.photos img{position:relative;display:block;width:100%;height:100%;object-fit:cover;object-position:center}.photos figure.safe-fit img{object-fit:contain}
.photos-2{grid-template-columns:1fr 1fr}.photos-3{grid-template-columns:1.25fr 1fr;grid-template-rows:1fr 1fr}.photos-3 figure:first-child{grid-row:span 2}.photos-4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.footer{height:350px;flex-shrink:0;padding:27px 44px 34px;display:flex;flex-direction:column;border-top:7px solid var(--accent);background:#111719}
.identity{display:flex;align-items:center;gap:12px;color:#bcc7c9;font:700 25px/1.35 Sarabun,sans-serif;letter-spacing:.6px;margin-bottom:12px}.dot{height:9px;width:9px;background:var(--accent);border-radius:50%}.identity:has(.brand:empty){display:none}
.title{font:700 73px/1.20 Kanit,sans-serif;color:var(--accent);margin:0;max-height:180px;overflow:visible;overflow-wrap:anywhere;word-break:normal}
.subtitle{font:700 36px/1.45 Sarabun,sans-serif;color:#eff2f0;margin:12px 0 0;overflow-wrap:anywhere}.subtitle:empty{display:none}.price{font:700 38px/1.25 Kanit,sans-serif;margin-top:8px;color:#fff}.price:empty{display:none}
.social .footer{height:315px;border-top-width:3px;background:#161819}.social .identity{font-size:24px}.social .title{color:#f2efdf;font-size:65px}.social .subtitle{font-size:34px;color:#c7cbc6}
</style></head><body><main id="canvas"><section class="photos" id="photos"></section><section class="footer"><div class="identity"><span class="dot"></span><span class="brand" id="brand"></span></div><h1 class="title" id="title"></h1><p class="subtitle" id="subtitle"></p><div class="price" id="price"></div></section></main><script>
/*DATA*/
(async()=>{try{
const canvas=document.querySelector('#canvas');canvas.style.setProperty('--w',data.width+'px');canvas.style.setProperty('--h',data.height+'px');canvas.style.setProperty('--accent',data.accent);if(data.platform!=='facebook')canvas.classList.add('social');
for(const key of ['brand','title','subtitle'])document.getElementById(key).textContent=data[key];document.getElementById('price').textContent=data.price?'ราคา '+data.price+' บาท':'';
const photos=document.querySelector('#photos');photos.classList.add(data.layout);
for(const src of data.photos){const figure=document.createElement('figure');const img=document.createElement('img');img.src=src;img.alt='';figure.append(img);photos.append(figure);}
await document.fonts.ready;await Promise.all([...photos.querySelectorAll('img')].map(img=>img.decode()));
if(!document.fonts.check('700 72px Kanit')||!document.fonts.check('700 36px Sarabun'))throw new Error('Required Thai font did not load');
const title=document.querySelector('#title'),sub=document.querySelector('#subtitle'),footer=document.querySelector('.footer');
function fit(el,min,maxLines){let size=parseFloat(getComputedStyle(el).fontSize);while(size>=min){el.style.fontSize=size+'px';const line=parseFloat(getComputedStyle(el).lineHeight);if(el.scrollWidth<=el.clientWidth+1&&el.scrollHeight<=line*maxLines+2)return;size-=1;}throw new Error('ข้อความยาวเกินไป กรุณาย่อหัวเรื่องหรือคำอธิบาย');}
fit(title,46,2);fit(sub,28,1);
const end=[title,sub,document.querySelector('#price')].filter(el=>el.textContent).reduce((n,el)=>Math.max(n,el.getBoundingClientRect().bottom),0);
const footerHeight=Math.max(255,Math.ceil(end-footer.getBoundingClientRect().top+34));if(footerHeight>405)throw new Error('Sales footer text overflows');footer.style.height=footerHeight+'px';
const photoFits=[];for(const img of photos.querySelectorAll('img')){const box=img.parentElement.getBoundingClientRect(),imageRatio=img.naturalWidth/img.naturalHeight,boxRatio=box.width/box.height;const retained=Math.min(imageRatio/boxRatio,boxRatio/imageRatio),threshold=data.photos.length===1?.78:.6;if(retained<threshold){img.parentElement.classList.add('safe-fit');img.parentElement.style.setProperty('--photo',`url("${img.src}")`);}photoFits.push(retained<threshold?'contain':'cover');}
window.__QC__={width:data.width,height:data.height,photos:data.photos.length,layout:data.layout,brand:data.brand,platform:data.platform,photoFits,footerHeight,titleSize:parseFloat(getComputedStyle(title).fontSize),subtitleSize:parseFloat(getComputedStyle(sub).fontSize),fontsReady:document.fonts.status==='loaded',imagesDecoded:[...photos.querySelectorAll('img')].every(img=>img.complete&&img.naturalWidth>0),textFits:true,priceShown:!!data.price};window.__READY__=true;
}catch(error){window.__ERROR__=error.message;}})();
</script></body></html>
