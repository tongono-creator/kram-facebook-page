name: Kram Bot

on:
  schedule:
    - cron: "0 3 * * *"   # 10:00 BKK
    - cron: "0 8 * * *"   # 15:00 BKK
    - cron: "0 13 * * *"  # 20:00 BKK
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode to run (default, dilemma, video, image)'
        required: false
        default: 'default'

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install google-genai requests openpyxl Pillow tweepy
      - name: Run bot
        env:
          KRAM_PAGE_ACCESS_TOKEN: ${{ secrets.KRAM_PAGE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          if [ -n "${{ inputs.mode }}" ] && [ "${{ inputs.mode }}" != "default" ]; then
            python kram.py --mode=${{ inputs.mode }}
          else
            python kram.py
          fi

      - name: Commit and push if history updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python merge_history.py
