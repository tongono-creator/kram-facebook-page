name: Product Review Post (CatDumb Style)

on:
  schedule:
    # à¸­à¸±à¸‡à¸„à¸²à¸£, à¸žà¸¤à¸«à¸±à¸ªà¸šà¸”à¸µ, à¹€à¸ªà¸²à¸£à¹Œ 04:45 BKK (à¸¥à¸”à¸„à¸§à¸²à¸¡à¸–à¸µà¹ˆà¹€à¸›à¹‡à¸™ à¸žà¸¸à¸˜, à¹€à¸ªà¸²à¸£à¹Œ 18:30 BKK)
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests openpyxl Pillow numpy playwright
          playwright install --with-deps chromium

      - name: Run review script
        env:
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          KRAM_PAGE_ACCESS_TOKEN: ${{ secrets.KRAM_PAGE_ACCESS_TOKEN }}
          PAGE_ID:                ${{ secrets.PAGE_ID }}
          IMMEDIATE:              ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: mkdir -p output && python review.py > output/review_run.log 2>&1

      - name: Commit and push if Excel updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add review_products.xlsx output/review_run.log || true
          if git diff --cached --quiet; then
            echo "No changes in review_products.xlsx"
          else
            git commit -m "Update review_products.xlsx and logs [skip ci]"
                        # Stash other changes so pull-rebase succeeds
            HAS_CHANGES=$(git status --porcelain | grep -v "review_products.xlsx" || true)
            if [ -n "$HAS_CHANGES" ]; then
              echo "Stashing unstaged changes before pull..."
              git stash --include-untracked
              git pull --rebase
              echo "Restoring stashed changes..."
              git stash pop || true
            else
              git pull --rebase
            fi
            git push
          fi
