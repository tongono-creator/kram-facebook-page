name: Schedule EP14 (one-off)

# Facebook only accepts a scheduled time up to ~4 weeks ahead, so EP14 (2026-11-09 19:30 BKK)
# is handed to Facebook on 2026-10-15. The year guard makes it a no-op in later years.
on:
  schedule:
    - cron: "0 3 15 10 *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Only in 2026
        id: guard
        run: |
          if [ "$(date -u +%Y)" = "2026" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; else echo "go=no" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.go == 'yes'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == 'yes'
        with:
          python-version: "3.12"
      - name: Post reel
        if: steps.guard.outputs.go == 'yes'
        env:
          KRAM_PAGE_ACCESS_TOKEN: ${{ secrets.KRAM_PAGE_ACCESS_TOKEN }}
          VIDEO_URL: https://github.com/tongono-creator/kram-facebook-page/releases/download/science-ep14/ep14_ice_floats.mp4
          PUBLISH_AT: "1794227400"
          CAPTION: |
            น้ำแข็งก็คือน้ำ แต่ทำไมลอยน้ำได้? 🧊
            น้ำขยายตัวราว 9% ตอนแข็งตัว เลยเบากว่าน้ำ
            ภูเขาน้ำแข็งเลยซ่อนอยู่ใต้น้ำถึงราว 90%!
            
            #กรามค้าง #วิทยาศาสตร์ #รู้ไว้ใช่ว่า
        run: pip install requests && python post_reel.py
