name: Content Studio read-only profile audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.32,<3'
      - name: Verify profile audit safety tests
        run: python -m unittest discover -s content_studio/tests -p test_profile_audit.py
      - name: Read exact Facebook page profile
        env:
          PAGE_ACCESS_TOKEN: ${{ secrets.KRAM_PAGE_ACCESS_TOKEN }}
        run: python content_studio/profile_audit.py --channel kram_fb > page_profile_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-profile-audit
          path: page_profile_audit.json
          retention-days: 30
